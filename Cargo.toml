[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace]
resolver = "3"
members = ["crates/*", "tui"]

[workspace.dependencies]
rand = { version = "0.10.3", default-features = false, features = ["std", "std_rng"] }
crossterm = "0.29"
ratatui = "0.30"
ladies-core = { path = "crates/ladies-core" }
ladies-sim = { path = "crates/ladies-sim" }
ladies-session = { path = "crates/ladies-session" }
